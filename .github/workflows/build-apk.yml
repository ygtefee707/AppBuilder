name: HYPEX Android APK Builder

on:
  workflow_dispatch:
    inputs:
      config_json:
        description: 'JSON Configuration Payload'
        required: true
        type: string
        default: '{"url":"https://hypex.tech","appName":"HYPEX Web","packageName":"tech.hypex.app","versionName":"1.0.0","versionCode":1}'

jobs:
  build:
    name: Build & Sign Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create Build Config Payload
        run: |
          echo '${{ inputs.config_json }}' > build_config.json
          python3 scripts/configure-project.py build_config.json

      - name: Grant Execute Permissions for Gradlew
        working-directory: ./android-template
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x gradlew

      - name: Build APK with Gradle
        working-directory: ./android-template
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Sign APK (Production Keystore or Auto-Generated)
        working-directory: ./android-template
        run: |
          APK_PATH=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: Release APK not found!"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"

          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "Using Android Build Tools: $BUILD_TOOLS_DIR"

          # Check if custom Keystore secret is provided
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Signing with Custom Production Keystore..."
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
            $BUILD_TOOLS_DIR/apksigner sign --ks release.keystore \
              --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
              --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
              --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
              --out release-signed.apk "$APK_PATH"
          else
            echo "Generating Standalone Release Signing Key..."
            keytool -genkey -v -keystore auto-release.jks -alias hypexkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass hypexpass123 -keypass hypexpass123 \
              -dname "CN=HYPEX, OU=Builder, O=HYPEX Tech, L=Global, S=Global, C=TR"
            
            $BUILD_TOOLS_DIR/zipalign -v -p 4 "$APK_PATH" release-aligned.apk
            $BUILD_TOOLS_DIR/apksigner sign --ks auto-release.jks \
              --ks-key-alias hypexkey \
              --ks-pass pass:hypexpass123 \
              --key-pass pass:hypexpass123 \
              --out release-signed.apk release-aligned.apk
          fi

          mkdir -p ../dist
          cp release-signed.apk ../dist/hypex-app-release.apk

      - name: Upload Temporary Artifact (Auto-Deleted via 1 Day TTL)
        uses: actions/upload-artifact@v4
        with:
          name: hypex-android-apk
          path: dist/hypex-app-release.apk
          retention-days: 1

      - name: Temporary Storage Upload (Direct Download URL)
        run: |
          echo "===> Uploading APK to temporary 1-hour fast download bridge..."
          DOWNLOAD_URL=$(curl --upload-file dist/hypex-app-release.apk "https://transfer.sh/hypex-app.apk" || echo "")
          echo "Direct Temporary Download URL: $DOWNLOAD_URL"
          echo "DOWNLOAD_URL=$DOWNLOAD_URL" >> $GITHUB_ENV
